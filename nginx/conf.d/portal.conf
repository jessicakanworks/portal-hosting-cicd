server {
    listen 443 ssl http2;
    server_name portal.example.gov.rw;
    ssl_certificate /etc/nginx/certs/portal-fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/portal-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'";
    location / { proxy_pass http://portal:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Real-IP $remote_addr; }
}
server {
    listen 443 ssl http2;
    server_name helpdesk.example.gov.rw;
    ssl_certificate /etc/nginx/certs/helpdesk-fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/helpdesk-key.pem;
    location / { proxy_pass http://ticketing:80; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
}
server { listen 80; return 301 https://$host$request_uri; }
