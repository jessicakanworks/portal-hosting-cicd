services:
  portal:
    image: ${REGISTRY}/portal:${TAG:-latest}
    env_file: .env
    environment: {DATABASE_URL: "postgresql://portal:${DB_PASSWORD}@db:5432/portal"}
    depends_on: {db: {condition: service_healthy}}
    healthcheck: {test: ["CMD", "curl", "-fs", "http://localhost:8000/healthz"], interval: 30s, timeout: 5s, retries: 3}
    restart: unless-stopped
  ticketing:
    image: ${REGISTRY}/ticketing:${TAG:-latest}
    env_file: .env
    depends_on: {db: {condition: service_healthy}}
    restart: unless-stopped
  db:
    image: postgres:16
    environment: {POSTGRES_USER: portal, POSTGRES_PASSWORD: ${DB_PASSWORD}, POSTGRES_DB: portal}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U portal"], interval: 10s, retries: 5}
    restart: unless-stopped
  backup:
    image: postgres:16
    entrypoint: ["/bin/sh", "/backup/pg_backup.sh"]
    environment: {PGPASSWORD: ${DB_PASSWORD}}
    volumes: ["./backup:/backup:ro", "backups:/backups"]
    depends_on: [db]
    restart: unless-stopped
  nginx:
    image: nginx:1.27-alpine
    volumes: ["./nginx/portal.conf:/etc/nginx/conf.d/default.conf:ro", "./nginx/certs:/etc/nginx/certs:ro"]
    ports: ["80:80", "443:443"]
    depends_on: [portal, ticketing]
    restart: unless-stopped
volumes:
  pgdata: {}
  backups: {}
