limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
upstream portal { server portal:8000; keepalive 16; }
upstream ticketing { server ticketing:8080; keepalive 16; }

server { listen 80; return 301 https://$host$request_uri; }

server {
    listen 443 ssl http2;
    server_name portal.example.net;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    location /static/ { proxy_pass http://portal; expires 7d; add_header Cache-Control public; }
    location /login   { limit_req zone=login burst=10 nodelay; proxy_pass http://portal; include /etc/nginx/proxy_params; }
    location /tickets/ { proxy_pass http://ticketing/; include /etc/nginx/proxy_params; }
    location /        { proxy_pass http://portal; include /etc/nginx/proxy_params; }
}
