stages: [build, test, release, deploy]
variables:
  REGISTRY: $CI_REGISTRY_IMAGE
  DOCKER_BUILDKIT: "1"

build:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
    - docker build --cache-from $REGISTRY/portal:latest -t $REGISTRY/portal:$CI_COMMIT_SHORT_SHA ./portal
    - docker push $REGISTRY/portal:$CI_COMMIT_SHORT_SHA

test:
  stage: test
  image: $REGISTRY/portal:$CI_COMMIT_SHORT_SHA
  script: [pytest -q]

release:
  stage: release
  image: docker:27
  services: [docker:27-dind]
  rules: [{ if: $CI_COMMIT_TAG }]
  script:
    - docker pull $REGISTRY/portal:$CI_COMMIT_SHORT_SHA
    - docker tag  $REGISTRY/portal:$CI_COMMIT_SHORT_SHA $REGISTRY/portal:$CI_COMMIT_TAG
    - docker push $REGISTRY/portal:$CI_COMMIT_TAG

.deploy: &deploy
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s) && echo "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -
  script:
    - ssh -o StrictHostKeyChecking=accept-new deploy@$HOST "cd /srv/portal && TAG=$TAG docker compose -f docker-compose.yml -f $COMPOSE_OVERRIDE pull && TAG=$TAG docker compose -f docker-compose.yml -f $COMPOSE_OVERRIDE up -d --remove-orphans && docker compose ps"
    - sleep 20 && wget -qO- https://$URL/healthz

deploy:staging:
  <<: *deploy
  variables: {HOST: staging.example.net, URL: staging-portal.example.net, TAG: $CI_COMMIT_SHORT_SHA, COMPOSE_OVERRIDE: docker-compose.yml}
  environment: {name: staging, url: https://staging-portal.example.net}
  rules: [{ if: $CI_COMMIT_BRANCH == "main" }]

deploy:production:
  <<: *deploy
  variables: {HOST: prod.example.net, URL: portal.example.net, TAG: $CI_COMMIT_TAG, COMPOSE_OVERRIDE: docker-compose.prod.yml}
  environment: {name: production, url: https://portal.example.net}
  rules: [{ if: $CI_COMMIT_TAG }]
  when: manual
